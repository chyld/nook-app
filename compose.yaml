# The notes app, version 2 (SPEC2 13). The same file runs on the VPS and on a developer's
# machine. It runs as it is, at https://localhost:9988; a .env file changes the settings (see
# .env.example). Run from this folder:
#   docker compose up -d --build
name: notesv2

x-logging: &logging
  driver: ${LOG_DRIVER:-json-file}

services:
  # Runs once before the app: makes ./data/notes (and the socket's folder) belong to the user
  # the app runs as. Docker creates a missing folder as root, which the app could not write to.
  owner:
    image: notesv2-app:latest
    pull_policy: never
    restart: "no"
    logging: *logging
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["chown", "-R", "${PUID:-1000}:${PGID:-1000}", "/srv/notes", "/run/notes"]
    volumes:
      - ./data/notes:/srv/notes
      - notes-run:/run/notes

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: notesv2-app:latest
    restart: unless-stopped
    logging: *logging
    # Section 5: unprivileged user, read-only root, no capabilities, no new privileges; the
    # port is not published (Caddy is in front). It runs as the person who owns this folder
    # (PUID and PGID, 1000 unless .env says otherwise), so the files in ./data are theirs.
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      owner:
        condition: service_completed_successfully
    read_only: true
    mem_limit: ${APP_MEMORY_LIMIT:-768m}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      NOTES_TRUSTED_PROXY: caddy
    volumes:
      - ./data/notes:/srv/notes
      - notes-run:/run/notes
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/favicon.svg').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    # Published to the internet: read-only root, no capabilities but binding ports 80 and 443,
    # no new privileges. Caddy writes only to its volumes and /tmp.
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-9987}:80"
      - "${HTTPS_PORT:-9988}:443"
      - "${HTTPS_PORT:-9988}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config

  # Run nightly by a timer on the host (or by hand): docker compose run --rm backup
  backup:
    build:
      context: .
      dockerfile: Dockerfile
      target: backup
    image: notesv2-backup:latest
    profiles: [backup]
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=512m,mode=1777
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/notes:/srv/notes
      - notes-run:/run/notes

# Everything that is kept is in ./data. This volume holds only the admin socket.
volumes:
  notes-run:
